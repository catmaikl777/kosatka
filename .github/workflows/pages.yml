name: Deploy site to GitHub Pages

# Фронтенд живёт на GitHub Pages, бэкенд — на PaaS.
# Адрес бэкенда берётся из PO_SERVER_URL — это Variable или Secret репозитория
# (Settings → Secrets and variables → Actions), например wss://kosatka.onrender.com/ws.
# Что-то одно из двух: workflow сначала пробует Variable, затем Secret.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'img/**'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'tools/prepare-pages.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Показать адрес бэкенда
        run: |
          if [ -z "$PO_SERVER_URL" ]; then
            echo "::warning::Переменная PO_SERVER_URL не задана — клиент будет искать /ws на своём хосте (GitHub Pages его не отдаёт) и уйдёт в офлайн. Задай её в Settings → Secrets and variables → Actions → Variables."
          else
            echo "Бэкенд: $PO_SERVER_URL"
          fi
        env:
          PO_SERVER_URL: ${{ vars.PO_SERVER_URL || secrets.PO_SERVER_URL }}

      - name: Проверить клиент и спрайты
        run: |
          node tools/checkclient.mjs
          node tools/checksprites.mjs

      - name: Собрать статику для Pages
        env:
          PO_SERVER_URL: ${{ vars.PO_SERVER_URL || secrets.PO_SERVER_URL }}
        run: node tools/prepare-pages.mjs

      - name: Проверить артефакт сборки
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/.nojekyll
          ls -la dist

      - uses: actions/configure-pages@v5
        with:
          enablement: true      # создать сайт Pages, если его ещё нет

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
